name: Scan official Meteor versions daily

concurrency:
  group: meteor-archive-updates
  cancel-in-progress: false

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Scan official pages and APIs
        run: python scripts/scan_official.py
      - name: Commit changed scan report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A daily-scan.json
          git diff --cached --quiet || git commit -m 'chore: update daily official version scan'
          git pull --rebase origin master
          git push origin HEAD:master
